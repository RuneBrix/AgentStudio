[package]
name = "agent-studio"
version = "0.1.1"
description = "A local-first explorer for repository agent instructions and skills"
authors = ["AgentStudio contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "agent_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agent-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
